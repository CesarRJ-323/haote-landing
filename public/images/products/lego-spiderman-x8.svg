<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-spidey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBEB"/>
      <stop offset="100%" stop-color="#FFD6D6"/>
    </linearGradient>
    <filter id="shadow-spidey" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#E53E3E" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Card Area -->
  <rect width="800" height="600" rx="32" fill="url(#bg-spidey)"/>
  <circle cx="400" cy="300" r="220" fill="#FFC9C9" opacity="0.5"/>

  <!-- Web decoration in corners -->
  <path d="M120 120 Q 220 200 320 120" stroke="#E53E3E" stroke-width="2" stroke-dasharray="6 6" opacity="0.3"/>
  <path d="M120 180 Q 220 260 320 180" stroke="#E53E3E" stroke-width="2" stroke-dasharray="6 6" opacity="0.3"/>
  
  <!-- Mini Brick Platform -->
  <g transform="translate(250, 420)">
    <rect x="0" y="20" width="300" height="40" rx="12" fill="#E53E3E"/>
    <rect x="30" y="4" width="40" height="20" rx="6" fill="#FF5252"/>
    <rect x="90" y="4" width="40" height="20" rx="6" fill="#FF5252"/>
    <rect x="150" y="4" width="40" height="20" rx="6" fill="#FF5252"/>
    <rect x="210" y="4" width="40" height="20" rx="6" fill="#FF5252"/>
    <rect x="270" y="4" width="40" height="20" rx="6" fill="#FF5252"/>
  </g>

  <!-- Central Lego Spiderman Figure Illustration -->
  <g transform="translate(310, 160)" filter="url(#shadow-spidey)">
    <!-- Head / Mask -->
    <rect x="40" y="30" width="100" height="90" rx="28" fill="#E53E3E"/>
    <!-- Head stud -->
    <rect x="75" y="15" width="30" height="18" rx="6" fill="#FF5252"/>
    <!-- Big expressive Spidey Eyes -->
    <path d="M52 65 Q 65 62 82 78 Q 70 88 52 80 Z" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M128 65 Q 115 62 98 78 Q 110 88 128 80 Z" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="6" stroke-linejoin="round"/>
    <!-- Web lines on face -->
    <line x1="90" y1="30" x2="90" y2="120" stroke="#1E1B3A" stroke-width="3" opacity="0.6"/>
    <line x1="40" y1="75" x2="140" y2="75" stroke="#1E1B3A" stroke-width="3" opacity="0.6"/>

    <!-- Torso -->
    <path d="M30 125 L 150 125 L 140 215 L 40 215 Z" fill="#E53E3E"/>
    <!-- Blue Sides -->
    <path d="M30 125 L 55 125 L 60 215 L 40 215 Z" fill="#2563EB"/>
    <path d="M150 125 L 125 125 L 120 215 L 140 215 Z" fill="#2563EB"/>
    <!-- Spider Emblem -->
    <circle cx="90" cy="165" r="8" fill="#1E1B3A"/>
    <path d="M85 160 L 72 150 M85 165 L 70 165 M85 170 L 72 180" stroke="#1E1B3A" stroke-width="3" stroke-linecap="round"/>
    <path d="M95 160 L 108 150 M95 165 L 110 165 M95 170 L 108 180" stroke="#1E1B3A" stroke-width="3" stroke-linecap="round"/>

    <!-- Belt -->
    <rect x="40" y="215" width="100" height="15" fill="#1E1B3A"/>

    <!-- Legs -->
    <rect x="42" y="230" width="44" height="65" rx="8" fill="#2563EB"/>
    <rect x="94" y="230" width="44" height="65" rx="8" fill="#2563EB"/>
    <!-- Boots -->
    <rect x="42" y="270" width="44" height="25" rx="6" fill="#E53E3E"/>
    <rect x="94" y="270" width="44" height="25" rx="6" fill="#E53E3E"/>

    <!-- Hands (Lego C-Claws) -->
    <path d="M22 170 Q 10 175 12 195 Q 16 205 28 200" fill="none" stroke="#FFD23F" stroke-width="10" stroke-linecap="round"/>
    <path d="M158 170 Q 170 175 168 195 Q 164 205 152 200" fill="none" stroke="#FFD23F" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Pack Indicator Pill Overlay -->
  <g transform="translate(60, 60)">
    <rect width="170" height="46" rx="23" fill="#1B1464"/>
    <text x="85" y="29" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#FFD23F" text-anchor="middle">
      PACK X8 SURTIDO
    </text>
  </g>

  <!-- Tag / Badge -->
  <g transform="translate(620, 60)">
    <rect width="120" height="46" rx="23" fill="#FFD23F"/>
    <text x="60" y="29" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#1B1464" text-anchor="middle">
      TOP #1
    </text>
  </g>
</svg>

