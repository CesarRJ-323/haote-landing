<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-agua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="shadow-agua" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#bg-agua)"/>
  <circle cx="400" cy="300" r="220" fill="#7DD3FC" opacity="0.5"/>

  <!-- Water droplets and splashes -->
  <circle cx="200" cy="180" r="14" fill="#38BDF8" opacity="0.7"/>
  <circle cx="230" cy="140" r="8" fill="#38BDF8" opacity="0.6"/>
  <circle cx="620" cy="380" r="18" fill="#38BDF8" opacity="0.7"/>
  <circle cx="650" cy="340" r="10" fill="#38BDF8" opacity="0.6"/>

  <!-- Backpack Tank + Water Blaster Gun -->
  <g transform="translate(240, 110)" filter="url(#shadow-agua)">
    <!-- Water Tank (Spidey / Hero design shaped backpack) -->
    <rect x="50" y="40" width="180" height="250" rx="45" fill="#EF4444" stroke="#DC2626" stroke-width="6"/>
    <!-- Yellow filling cap on top -->
    <rect x="110" y="15" width="60" height="30" rx="10" fill="#FACC15" stroke="#EAB308" stroke-width="4"/>
    
    <!-- Water level gauge window -->
    <rect x="80" y="80" width="120" height="150" rx="20" fill="#0284C7"/>
    <path d="M80 140 Q 110 130 140 140 T 200 140 L 200 230 L 80 230 Z" fill="#38BDF8"/>
    <!-- Cute bubble inside water gauge -->
    <circle cx="110" cy="180" r="12" fill="#BAE6FD" opacity="0.8"/>
    <circle cx="150" cy="160" r="8" fill="#BAE6FD" opacity="0.8"/>

    <!-- Backpack Straps (left and right) -->
    <path d="M50 80 Q 15 140 50 220" stroke="#FACC15" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M230 80 Q 265 140 230 220" stroke="#FACC15" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Flexible Water Hose connected to gun -->
    <path d="M140 290 C 140 370 240 390 280 320" stroke="#0284C7" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Pump Water Gun Blaster -->
    <g transform="translate(170, 270) rotate(-15)">
      <!-- Main Gun Body -->
      <rect x="60" y="40" width="160" height="40" rx="14" fill="#0284C7"/>
      <!-- Gun Barrel Nozzle -->
      <rect x="220" y="46" width="30" height="28" rx="8" fill="#FACC15"/>
      <rect x="250" y="52" width="15" height="16" rx="4" fill="#EF4444"/>
      <!-- Pump Handle underneath -->
      <rect x="120" y="80" width="70" height="22" rx="11" fill="#10B981"/>
      <rect x="140" y="65" width="30" height="20" rx="6" fill="#059669"/>
      <!-- Trigger Grip -->
      <path d="M75 80 L 60 130 L 95 130 L 105 80 Z" fill="#EF4444"/>
      <!-- Trigger -->
      <path d="M95 90 Q 98 102 92 108" stroke="#FACC15" stroke-width="6" fill="none"/>
      
      <!-- Water Jet Stream Burst -->
      <path d="M270 60 Q 330 40 400 50" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none"/>
      <circle cx="415" cy="52" r="10" fill="#38BDF8"/>
      <circle cx="435" cy="55" r="6" fill="#38BDF8"/>
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="180" height="46" rx="23" fill="#1B1464"/>
    <text x="90" y="29" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#FFD23F" text-anchor="middle">
      PACK X4 SURTIDO
    </text>
  </g>

  <g transform="translate(560, 60)">
    <rect width="180" height="46" rx="23" fill="#2DD4FF"/>
    <text x="90" y="29" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#1B1464" text-anchor="middle">
      LÍNEA VERANO
    </text>
  </g>
</svg>

