<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-poke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="shadow-poke" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#D97706" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#bg-poke)"/>
  <circle cx="400" cy="300" r="220" fill="#FDE68A" opacity="0.6"/>

  <!-- Pokeball watermark -->
  <g transform="translate(620, 430)" opacity="0.2">
    <circle cx="60" cy="60" r="50" stroke="#D97706" stroke-width="8" fill="none"/>
    <line x1="10" y1="60" x2="110" y2="60" stroke="#D97706" stroke-width="8"/>
    <circle cx="60" cy="60" r="16" fill="#D97706"/>
    <circle cx="60" cy="60" r="8" fill="#FFF"/>
  </g>

  <!-- Lego Brick Platform -->
  <g transform="translate(250, 420)">
    <rect x="0" y="20" width="300" height="40" rx="12" fill="#D97706"/>
    <rect x="30" y="4" width="40" height="20" rx="6" fill="#F59E0B"/>
    <rect x="90" y="4" width="40" height="20" rx="6" fill="#F59E0B"/>
    <rect x="150" y="4" width="40" height="20" rx="6" fill="#F59E0B"/>
    <rect x="210" y="4" width="40" height="20" rx="6" fill="#F59E0B"/>
    <rect x="270" y="4" width="40" height="20" rx="6" fill="#F59E0B"/>
  </g>

  <!-- Pikachu Lego Figure -->
  <g transform="translate(300, 130)" filter="url(#shadow-poke)">
    <!-- Ears -->
    <path d="M40 70 L 10 -10 L 45 10 Z" fill="#FBBF24"/>
    <path d="M10 -10 L 25 -2 L 20 25 Z" fill="#1E1B3A"/>
    <path d="M160 70 L 190 -10 L 155 10 Z" fill="#FBBF24"/>
    <path d="M190 -10 L 175 -2 L 180 25 Z" fill="#1E1B3A"/>

    <!-- Lightning Bolt Tail in back -->
    <path d="M170 170 L 220 140 L 200 120 L 240 80" stroke="#F59E0B" stroke-width="14" stroke-linecap="square" fill="none"/>

    <!-- Head -->
    <rect x="50" y="40" width="100" height="90" rx="28" fill="#FBBF24"/>
    <rect x="85" y="25" width="30" height="18" rx="6" fill="#FCD34D"/>

    <!-- Eyes -->
    <circle cx="75" cy="75" r="10" fill="#1E1B3A"/>
    <circle cx="73" cy="72" r="3" fill="#FFFFFF"/>
    <circle cx="125" cy="75" r="10" fill="#1E1B3A"/>
    <circle cx="123" cy="72" r="3" fill="#FFFFFF"/>

    <!-- Red Cheeks -->
    <circle cx="62" cy="95" r="12" fill="#EF4444"/>
    <circle cx="138" cy="95" r="12" fill="#EF4444"/>

    <!-- Nose & Smile -->
    <polygon points="100,82 98,85 102,85" fill="#1E1B3A"/>
    <path d="M92 92 Q 100 98 108 92" stroke="#1E1B3A" stroke-width="3" fill="none"/>

    <!-- Torso -->
    <path d="M40 130 L 160 130 L 150 220 L 50 220 Z" fill="#FBBF24"/>
    <!-- Brown stripes on back/sides -->
    <rect x="44" y="150" width="16" height="10" rx="3" fill="#B45309"/>
    <rect x="140" y="150" width="16" height="10" rx="3" fill="#B45309"/>
    <rect x="46" y="175" width="16" height="10" rx="3" fill="#B45309"/>
    <rect x="138" y="175" width="16" height="10" rx="3" fill="#B45309"/>

    <!-- Legs -->
    <rect x="52" y="225" width="44" height="65" rx="8" fill="#F59E0B"/>
    <rect x="104" y="225" width="44" height="65" rx="8" fill="#F59E0B"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="170" height="46" rx="23" fill="#1B1464"/>
    <text x="85" y="29" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#FFD23F" text-anchor="middle">
      PACK X8 SURTIDO
    </text>
  </g>

  <g transform="translate(590, 60)">
    <rect width="150" height="46" rx="23" fill="#2DD4FF"/>
    <text x="75" y="29" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#1B1464" text-anchor="middle">
      COLECCIÓN
    </text>
  </g>
</svg>

