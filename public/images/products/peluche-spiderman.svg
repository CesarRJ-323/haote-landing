<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-peluche" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <filter id="shadow-peluche" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#BE123C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#bg-peluche)"/>
  <circle cx="400" cy="300" r="220" fill="#FECDD3" opacity="0.6"/>

  <!-- Soft Plush Spiderman Figure -->
  <g transform="translate(290, 100)" filter="url(#shadow-peluche)">
    <!-- Big cuddly plush head -->
    <ellipse cx="110" cy="120" rx="95" ry="90" fill="#E11D48"/>
    
    <!-- Plush embroidered web lines -->
    <path d="M110 30 Q 110 120 110 210" stroke="#881337" stroke-width="4" stroke-dasharray="8 4" fill="none"/>
    <path d="M15 120 Q 110 120 205 120" stroke="#881337" stroke-width="4" stroke-dasharray="8 4" fill="none"/>
    <circle cx="110" cy="120" r="50" stroke="#881337" stroke-width="3" stroke-dasharray="6 4" fill="none"/>

    <!-- Big cute plush eyes with embroidered border -->
    <path d="M45 100 Q 75 90 95 120 Q 70 135 45 100 Z" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="8" stroke-linejoin="round"/>
    <path d="M175 100 Q 145 90 125 120 Q 150 135 175 100 Z" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="8" stroke-linejoin="round"/>

    <!-- Plush arms (hugging pose) -->
    <ellipse cx="25" cy="240" rx="25" ry="45" transform="rotate(25 25 240)" fill="#E11D48"/>
    <ellipse cx="195" cy="240" rx="25" ry="45" transform="rotate(-25 195 240)" fill="#E11D48"/>

    <!-- Plush soft round body -->
    <ellipse cx="110" cy="240" rx="75" ry="70" fill="#E11D48"/>
    <!-- Blue chest patch -->
    <ellipse cx="110" cy="245" rx="45" ry="50" fill="#2563EB"/>
    
    <!-- Spider felt patch -->
    <circle cx="110" cy="240" r="10" fill="#1E1B3A"/>
    <line x1="100" y1="235" x2="88" y2="225" stroke="#1E1B3A" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="235" x2="132" y2="225" stroke="#1E1B3A" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="245" x2="88" y2="255" stroke="#1E1B3A" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="245" x2="132" y2="255" stroke="#1E1B3A" stroke-width="4" stroke-linecap="round"/>

    <!-- Plush chubby legs -->
    <ellipse cx="70" cy="330" rx="30" ry="35" fill="#E11D48"/>
    <ellipse cx="150" cy="330" rx="30" ry="35" fill="#E11D48"/>
    <!-- Blue shorts -->
    <path d="M50 280 C50 310 170 310 170 280 Z" fill="#2563EB"/>

    <!-- Hang tag on ear/head -->
    <g transform="translate(190, 70) rotate(15)">
      <polygon points="0,0 35,0 45,25 35,50 0,50" fill="#FFD23F" stroke="#B45309" stroke-width="2"/>
      <circle cx="12" cy="25" r="5" fill="#FFF"/>
      <text x="25" y="29" font-family="'Nunito', sans-serif" font-size="11" font-weight="900" fill="#1B1464">35cm</text>
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="170" height="46" rx="23" fill="#1B1464"/>
    <text x="85" y="29" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#FFD23F" text-anchor="middle">
      PACK X4 SOFT
    </text>
  </g>

  <g transform="translate(580, 60)">
    <rect width="160" height="46" rx="23" fill="#FF4D8D"/>
    <text x="80" y="29" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      REGALERÍA TOP
    </text>
  </g>
</svg>

