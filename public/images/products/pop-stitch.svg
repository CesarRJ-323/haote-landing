<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-pop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <filter id="shadow-pop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#BE185D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#bg-pop)"/>
  <circle cx="400" cy="300" r="220" fill="#FBCFE8" opacity="0.5"/>

  <!-- Pop Box Illustration -->
  <g transform="translate(230, 90)" filter="url(#shadow-pop)">
    <!-- Box Body -->
    <rect x="0" y="0" width="340" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
    
    <!-- Top Header of the Box -->
    <path d="M0 16C0 7.16 7.16 0 16 0H324C332.84 0 340 7.16 340 16V60H0V16Z" fill="#1B1464"/>
    <text x="24" y="40" font-family="'Fredoka', sans-serif" font-size="28" font-weight="700" fill="#FFD23F">POP!</text>
    <text x="95" y="40" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">DISNEY</text>
    
    <!-- Collector Number Circle -->
    <circle cx="300" cy="35" r="18" fill="#FF4D8D"/>
    <text x="300" y="41" font-family="'Nunito', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">626</text>

    <!-- Clear Plastic Window -->
    <rect x="25" y="75" width="230" height="270" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- POP Stitch inside window -->
    <g transform="translate(60, 100)">
      <!-- Giant Stitch Ears -->
      <path d="M15 70 C-30 40 -30 -10 15 10 C35 20 40 40 30 75 Z" fill="#2563EB"/>
      <path d="M10 65 C-20 45 -20 10 15 20 Z" fill="#F472B6"/>
      <path d="M145 70 C190 40 190 -10 145 10 C125 20 120 40 130 75 Z" fill="#2563EB"/>
      <path d="M150 65 C180 45 180 10 145 20 Z" fill="#F472B6"/>

      <!-- Giant Square-Rounded POP Head -->
      <rect x="25" y="30" width="110" height="95" rx="36" fill="#3B82F6"/>
      
      <!-- Big Black Funko Eyes -->
      <circle cx="55" cy="75" r="16" fill="#0F172A"/>
      <circle cx="105" cy="75" r="16" fill="#0F172A"/>

      <!-- Nose -->
      <path d="M72 88 Q 80 82 88 88 Q 80 96 72 88 Z" fill="#1E3A8A"/>

      <!-- Cute Tiny Body -->
      <rect x="55" y="125" width="50" height="55" rx="14" fill="#3B82F6"/>
      <ellipse cx="80" cy="148" rx="16" ry="14" fill="#93C5FD"/>

      <!-- Tiny paws -->
      <circle cx="62" cy="180" r="10" fill="#2563EB"/>
      <circle cx="98" cy="180" r="10" fill="#2563EB"/>
    </g>

    <!-- Bottom Banner on Box -->
    <rect x="0" y="355" width="340" height="65" rx="0" fill="#1B1464"/>
    <text x="30" y="392" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">STITCH</text>
    <text x="30" y="410" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#2DD4FF">VINYL FIGURE · FIGURINE EN VINYLE</text>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="180" height="46" rx="23" fill="#1B1464"/>
    <text x="90" y="29" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#FFD23F" text-anchor="middle">
      FIGURA EN CAJA
    </text>
  </g>

  <g transform="translate(580, 60)">
    <rect width="160" height="46" rx="23" fill="#FF4D8D"/>
    <text x="80" y="29" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      IDEAL KIOSCO
    </text>
  </g>
</svg>

