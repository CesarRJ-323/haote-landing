<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-stitch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FF"/>
      <stop offset="100%" stop-color="#D6E4FF"/>
    </linearGradient>
    <filter id="shadow-stitch" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2B6CB0" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="32" fill="url(#bg-stitch)"/>
  <circle cx="400" cy="300" r="220" fill="#C3DAFE" opacity="0.6"/>

  <!-- Lego Brick Platform -->
  <g transform="translate(250, 420)">
    <rect x="0" y="20" width="300" height="40" rx="12" fill="#3182CE"/>
    <rect x="30" y="4" width="40" height="20" rx="6" fill="#4299E1"/>
    <rect x="90" y="4" width="40" height="20" rx="6" fill="#4299E1"/>
    <rect x="150" y="4" width="40" height="20" rx="6" fill="#4299E1"/>
    <rect x="210" y="4" width="40" height="20" rx="6" fill="#4299E1"/>
    <rect x="270" y="4" width="40" height="20" rx="6" fill="#4299E1"/>
  </g>

  <!-- Stitch Lego Character -->
  <g transform="translate(290, 140)" filter="url(#shadow-stitch)">
    <!-- Big Alien Ears -->
    <!-- Left Ear -->
    <path d="M40 70 C-30 40 -40 -10 20 10 C50 20 60 40 50 80 Z" fill="#3182CE"/>
    <path d="M30 65 C-15 42 -20 8 20 22 C38 28 42 42 35 72 Z" fill="#F687B3"/>
    <!-- Right Ear -->
    <path d="M180 70 C250 40 260 -10 200 10 C170 20 160 40 170 80 Z" fill="#3182CE"/>
    <path d="M190 65 C235 42 240 8 200 22 C182 28 178 42 185 72 Z" fill="#F687B3"/>

    <!-- Head -->
    <rect x="55" y="40" width="110" height="95" rx="30" fill="#3182CE"/>
    <rect x="95" y="25" width="30" height="18" rx="6" fill="#4299E1"/>

    <!-- Eyes (Big glossy eyes) -->
    <ellipse cx="80" cy="80" rx="16" ry="20" fill="#1A202C"/>
    <circle cx="84" cy="74" r="6" fill="#FFFFFF"/>
    <ellipse cx="140" cy="80" rx="16" ry="20" fill="#1A202C"/>
    <circle cx="144" cy="74" r="6" fill="#FFFFFF"/>

    <!-- Cute Big Dark Blue Nose -->
    <path d="M100 95 Q 110 90 120 95 Q 110 108 100 95 Z" fill="#1A365D"/>
    <!-- Smile -->
    <path d="M92 112 Q 110 124 128 112" stroke="#1A202C" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Torso -->
    <path d="M50 135 L 170 135 L 160 225 L 60 225 Z" fill="#3182CE"/>
    <ellipse cx="110" cy="180" rx="35" ry="32" fill="#63B3ED"/>

    <!-- Legs -->
    <rect x="62" y="230" width="44" height="65" rx="10" fill="#2B6CB0"/>
    <rect x="114" y="230" width="44" height="65" rx="10" fill="#2B6CB0"/>
    <!-- Claws on feet -->
    <circle cx="74" cy="285" r="4" fill="#1A202C"/>
    <circle cx="84" cy="285" r="4" fill="#1A202C"/>
    <circle cx="94" cy="285" r="4" fill="#1A202C"/>
    <circle cx="126" cy="285" r="4" fill="#1A202C"/>
    <circle cx="136" cy="285" r="4" fill="#1A202C"/>
    <circle cx="146" cy="285" r="4" fill="#1A202C"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="170" height="46" rx="23" fill="#1B1464"/>
    <text x="85" y="29" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#FFD23F" text-anchor="middle">
      PACK X4 SURTIDO
    </text>
  </g>

  <g transform="translate(580, 60)">
    <rect width="160" height="46" rx="23" fill="#FF4D8D"/>
    <text x="80" y="29" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      VIRAL TIKTOK
    </text>
  </g>
</svg>

