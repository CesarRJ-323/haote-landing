<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-pvz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="shadow-pvz" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#059669" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#bg-pvz)"/>
  <circle cx="400" cy="300" r="220" fill="#A7F3D0" opacity="0.6"/>

  <!-- Grass platform tiles -->
  <g transform="translate(240, 420)">
    <rect x="0" y="20" width="320" height="40" rx="12" fill="#059669"/>
    <rect x="30" y="4" width="40" height="20" rx="6" fill="#10B981"/>
    <rect x="90" y="4" width="40" height="20" rx="6" fill="#10B981"/>
    <rect x="150" y="4" width="40" height="20" rx="6" fill="#10B981"/>
    <rect x="210" y="4" width="40" height="20" rx="6" fill="#10B981"/>
    <rect x="270" y="4" width="40" height="20" rx="6" fill="#10B981"/>
  </g>

  <!-- Zombie / Peashooter Lego Character -->
  <g transform="translate(305, 140)" filter="url(#shadow-pvz)">
    <!-- Zombie Conehead / Hair -->
    <path d="M50 45 L 95 -10 L 140 45 Z" fill="#F97316"/>
    <ellipse cx="95" cy="42" rx="45" ry="12" fill="#EA580C"/>

    <!-- Head (Pale green zombie skin) -->
    <rect x="45" y="40" width="100" height="90" rx="26" fill="#84CC16"/>
    
    <!-- Cartoon Asymmetric Zombie Eyes -->
    <circle cx="70" cy="78" r="14" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="4"/>
    <circle cx="73" cy="80" r="5" fill="#1E1B3A"/>
    <circle cx="120" cy="72" r="18" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="4"/>
    <circle cx="118" cy="70" r="7" fill="#1E1B3A"/>

    <!-- Goofy zombie mouth with single tooth -->
    <path d="M72 106 Q 95 120 120 102" stroke="#1E1B3A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="80" y="106" width="8" height="10" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="2"/>

    <!-- Business Suit / Tie (Classic Zombie) -->
    <path d="M35 130 L 155 130 L 145 220 L 45 220 Z" fill="#78716C"/>
    <!-- White shirt V -->
    <polygon points="95,130 80,130 85,170 95,185 105,170 110,130" fill="#F5F5F4"/>
    <!-- Red Tie -->
    <polygon points="92,135 98,135 100,180 95,195 90,180" fill="#DC2626"/>

    <!-- Legs -->
    <rect x="48" y="225" width="44" height="65" rx="8" fill="#1E3A8A"/>
    <rect x="98" y="225" width="44" height="65" rx="8" fill="#1E3A8A"/>
    <!-- Shoes -->
    <rect x="48" y="270" width="44" height="25" rx="6" fill="#44403C"/>
    <rect x="98" y="270" width="44" height="25" rx="6" fill="#44403C"/>

    <!-- Lego Peashooter mini sidekick -->
    <g transform="translate(145, 170)">
      <circle cx="30" cy="25" r="22" fill="#10B981"/>
      <ellipse cx="48" cy="25" rx="10" ry="14" fill="#047857"/>
      <circle cx="24" cy="18" r="4" fill="#FFF"/>
      <circle cx="24" cy="18" r="2" fill="#1E1B3A"/>
      <path d="M12 36 Q 30 50 30 70" stroke="#059669" stroke-width="6" fill="none"/>
      <!-- Pea projectile -->
      <circle cx="75" cy="25" r="9" fill="#34D399"/>
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="170" height="46" rx="23" fill="#1B1464"/>
    <text x="85" y="29" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#FFD23F" text-anchor="middle">
      PACK X4 SURTIDO
    </text>
  </g>

  <g transform="translate(580, 60)">
    <rect width="160" height="46" rx="23" fill="#3DDC97"/>
    <text x="80" y="29" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#1B1464" text-anchor="middle">
      ALTA ROTACIÓN
    </text>
  </g>
</svg>

